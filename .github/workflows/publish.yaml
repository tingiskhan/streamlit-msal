name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'

jobs:
  test:
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install and verify import
        # Build dir does not exist on a fresh checkout, so we stub it out before
        # installing to satisfy the RuntimeError in __init__.py.
        shell: bash
        run: |
          mkdir -p streamlit_entra/frontend/build
          touch streamlit_entra/frontend/build/index.html
          pip install -e .
          python -c "import streamlit_entra; print(streamlit_entra.__version__)"

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for OIDC trusted publishing
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # setuptools-scm needs full history to read tags

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        working-directory: streamlit_entra/frontend
        run: |
          npm ci
          npm run build
          # Remove node_modules so they don't end up in the Python wheel
          rm -rf node_modules

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build Python package
        run: |
          pip install build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
